<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="llama-kb architecture diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="660" rx="18" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="48" y="58" font-size="28" font-weight="700" fill="url(#head)">llama-kb architecture</text>
    <text x="48" y="88" font-size="15" fill="#8b949e">one folder of documents in · grounded, cited answers out</text>

    <!-- build pipeline label -->
    <text x="48" y="140" font-size="13" fill="#8b949e" letter-spacing="2">BUILD (incremental)</text>

    <!-- docs -->
    <g>
      <rect x="48" y="158" width="168" height="86" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="68" y="190" font-size="16" fill="#e6edf3">Documents</text>
      <text x="68" y="213" font-size="13" fill="#8b949e">.md  .txt  .pdf</text>
      <text x="68" y="232" font-size="13" fill="#8b949e">+ catalog.json</text>
    </g>
    <line x1="216" y1="201" x2="264" y2="201" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- loader/chunker -->
    <g>
      <rect x="264" y="158" width="176" height="86" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="284" y="190" font-size="16" fill="#e6edf3">Loader + chunker</text>
      <text x="284" y="213" font-size="13" fill="#8b949e">heading-aware</text>
      <text x="284" y="232" font-size="13" fill="#8b949e">700 / 900 chars</text>
    </g>
    <line x1="440" y1="201" x2="488" y2="201" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- embedder -->
    <g>
      <rect x="488" y="158" width="196" height="86" rx="10" fill="#161b22" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="508" y="190" font-size="16" fill="#2dd4bf">Embedder</text>
      <text x="508" y="213" font-size="13" fill="#8b949e">Qwen3-Embedding-0.6B</text>
      <text x="508" y="232" font-size="13" fill="#8b949e">1024-dim, bilingual</text>
    </g>
    <line x1="684" y1="201" x2="732" y2="201" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- stores -->
    <g>
      <rect x="732" y="146" width="200" height="56" rx="10" fill="#161b22" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="752" y="170" font-size="15" fill="#60a5fa">Chroma</text>
      <text x="752" y="190" font-size="12" fill="#8b949e">vectors · cosine</text>
    </g>
    <g>
      <rect x="732" y="212" width="200" height="56" rx="10" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="752" y="236" font-size="15" fill="#f59e0b">SQLite FTS5</text>
      <text x="752" y="256" font-size="12" fill="#8b949e">CJK bigrams · BM25</text>
    </g>
    <g>
      <rect x="952" y="170" width="200" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="972" y="197" font-size="13" fill="#e6edf3">manifest + checkpoints</text>
      <text x="972" y="217" font-size="12" fill="#8b949e">SHA-256 per file</text>
      <text x="972" y="235" font-size="12" fill="#8b949e">resume after crash</text>
    </g>

    <!-- divider -->
    <line x1="48" y1="298" x2="1152" y2="298" stroke="#30363d" stroke-dasharray="4 6"/>

    <!-- query pipeline label -->
    <text x="48" y="336" font-size="13" fill="#8b949e" letter-spacing="2">QUERY (streaming HTTP)</text>

    <!-- clients -->
    <g>
      <rect x="48" y="354" width="168" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="68" y="386" font-size="16" fill="#e6edf3">Clients</text>
      <text x="68" y="409" font-size="13" fill="#8b949e">terminal chat</text>
      <text x="68" y="427" font-size="13" fill="#8b949e">any OpenAI SDK</text>
    </g>
    <line x1="216" y1="396" x2="250" y2="396" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- router -->
    <g>
      <rect x="250" y="354" width="200" height="84" rx="10" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="270" y="386" font-size="16" fill="#f59e0b">Group router</text>
      <text x="270" y="409" font-size="13" fill="#8b949e">aliases · versions</text>
      <text x="270" y="427" font-size="13" fill="#8b949e">description fallback</text>
    </g>
    <line x1="450" y1="396" x2="490" y2="396" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- retriever -->
    <g>
      <rect x="490" y="354" width="230" height="84" rx="10" fill="#161b22" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="510" y="386" font-size="16" fill="#2dd4bf">Hybrid retriever</text>
      <text x="510" y="409" font-size="13" fill="#8b949e">dense top-20 + FTS top-20</text>
      <text x="510" y="427" font-size="13" fill="#8b949e">cosine rank + BM25 boost</text>
    </g>
    <line x1="720" y1="396" x2="760" y2="396" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- gate + prompt -->
    <g>
      <rect x="760" y="354" width="200" height="84" rx="10" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="780" y="386" font-size="16" fill="#f59e0b">Evidence gate</text>
      <text x="780" y="409" font-size="13" fill="#8b949e">grounded / no_evidence</text>
      <text x="780" y="427" font-size="13" fill="#8b949e">citation numbering</text>
    </g>
    <line x1="960" y1="396" x2="1000" y2="396" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- llm -->
    <g>
      <rect x="1000" y="354" width="152" height="84" rx="10" fill="#161b22" stroke="#c084fc" stroke-opacity="0.65"/>
      <text x="1020" y="386" font-size="16" fill="#c084fc">LLM backend</text>
      <text x="1020" y="409" font-size="13" fill="#8b949e">llama.cpp :8080</text>
      <text x="1020" y="427" font-size="13" fill="#8b949e">or Ollama / vLLM</text>
    </g>

    <!-- proxy bracket -->
    <path d="M 250 448 V 474 H 960 V 448" fill="none" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1.4"/>
    <text x="605" y="498" text-anchor="middle" font-size="13" fill="#60a5fa">llama-kb RAG proxy · :8081 · loopback by default</text>

    <!-- bottom facts -->
    <g font-size="12" fill="#8b949e">
      <text x="48" y="552">dense score primary · lexical boost up to +0.10 · global gate 0.42</text>
      <text x="48" y="578">sources + scores returned in X-KB-Sources · status in X-KB-Status</text>
      <text x="48" y="604">bilingual prompts · untrusted-document hardening · bounded context</text>
    </g>
    <g font-size="12">
      <rect x="880" y="536" width="14" height="14" rx="3" fill="#2dd4bf"/>
      <text x="902" y="548" fill="#8b949e">dense</text>
      <rect x="970" y="536" width="14" height="14" rx="3" fill="#f59e0b"/>
      <text x="992" y="548" fill="#8b949e">lexical / gate</text>
      <rect x="1100" y="536" width="14" height="14" rx="3" fill="#c084fc"/>
      <text x="1122" y="548" fill="#8b949e">LLM</text>
    </g>
  </g>
</svg>
